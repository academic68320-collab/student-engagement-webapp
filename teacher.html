<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard — Student Engagement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 40%, #0369a1 70%, #0e7490 100%); }
    .card        { background: rgba(15,23,42,0.75); border: 1px solid rgba(51,65,85,0.55); }
    .card-red    { background: rgba(127,29,29,0.25); border: 1px solid rgba(185,28,28,0.3); }
    .card-yellow { background: rgba(120,53,15,0.25); border: 1px solid rgba(180,83,9,0.3); }
    .card-green  { background: rgba(20,83,45,0.25);  border: 1px solid rgba(22,101,52,0.3); }
    .glow-input  { background:rgba(15,23,42,0.7); border:1px solid rgba(71,85,105,0.5); color:#e2e8f0; }
    .glow-input::placeholder { color:#475569; }
    .glow-input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,0.2); }
    select.glow-input option { background:#1e293b; color:#e2e8f0; }
  </style>
</head>
<body class="bg-[#080f1e] font-sarabun min-h-screen">

  <!-- Navbar -->
  <nav class="gradient-bg px-6 py-4 flex items-center justify-between sticky top-0 z-40 shadow-lg shadow-black/30">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
        <span class="text-white text-sm">🍎</span>
      </div>
      <span class="font-bold text-white hidden sm:block tracking-wide">Teacher Dashboard</span>
      <span class="text-white/30 hidden sm:inline">|</span>
      <span id="teacherName" class="text-sm text-blue-200 hidden sm:inline"></span>
    </div>
    <button onclick="AUTH.logout()"
      class="text-sm text-red-300 hover:text-red-200 transition-colors">ออกจากระบบ</button>
  </nav>

  <!-- Breadcrumb -->
  <div class="bg-slate-900/80 border-b border-slate-700/50 px-6 py-3 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto flex items-center gap-2 text-sm">
      <button onclick="TEACHER.goTo('courses')"
        class="text-blue-400 hover:text-blue-300 font-medium transition-colors">วิชาที่สอน</button>
      <span id="bcStudentWrap" class="hidden items-center gap-2">
        <span class="text-slate-600">›</span>
        <span id="bcCourseName" class="text-blue-400 hover:text-blue-300 font-medium cursor-pointer transition-colors"
          onclick="TEACHER.goTo('students')"></span>
      </span>
    </div>
  </div>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

    <!-- VIEW 1: Course List -->
    <div id="viewCourses">
      <h1 class="text-2xl font-bold text-white mb-6">วิชาที่รับผิดชอบ</h1>
      <div id="courseCards" class="space-y-3">
        <p class="text-center text-slate-500 py-8">กำลังโหลด...</p>
      </div>
    </div>

    <!-- VIEW 2: Student List -->
    <div id="viewStudents" class="hidden">
      <div class="mb-6">
        <h1 id="courseTitle" class="text-2xl font-bold text-white"></h1>
        <p id="courseSection" class="text-sm text-slate-400 mt-1"></p>
      </div>

      <!-- KPI -->
      <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-6">
        <div onclick="TEACHER.showRiskModal('')"
          class="card rounded-xl p-4 shadow-lg shadow-black/20 text-center cursor-pointer hover:border-blue-500/50 transition-all group">
          <p class="text-xs text-slate-400">นักเรียน</p>
          <p id="kpiTotal" class="text-2xl font-bold text-white mt-1">—</p>
          <p class="text-xs text-blue-500 mt-1 group-hover:text-blue-400 transition-colors">ดูรายชื่อ →</p>
        </div>
        <div onclick="TEACHER.showRiskModal('HIGH')"
          class="card-red rounded-xl p-4 shadow-lg shadow-black/20 text-center cursor-pointer hover:border-red-500/50 transition-all group">
          <p class="text-xs text-red-400">🔴 เสี่ยงสูง</p>
          <p id="kpiHigh" class="text-2xl font-bold text-red-400 mt-1">—</p>
          <p class="text-xs text-red-700 mt-1 group-hover:text-red-400 transition-colors">ดูรายชื่อ →</p>
        </div>
        <div onclick="TEACHER.showRiskModal('MEDIUM')"
          class="card-yellow rounded-xl p-4 shadow-lg shadow-black/20 text-center cursor-pointer hover:border-amber-500/50 transition-all group">
          <p class="text-xs text-amber-400">🟡 ปานกลาง</p>
          <p id="kpiMedium" class="text-2xl font-bold text-amber-400 mt-1">—</p>
          <p class="text-xs text-amber-700 mt-1 group-hover:text-amber-400 transition-colors">ดูรายชื่อ →</p>
        </div>
        <div onclick="TEACHER.showRiskModal('LOW')"
          class="card-green rounded-xl p-4 shadow-lg shadow-black/20 text-center cursor-pointer hover:border-emerald-500/50 transition-all group">
          <p class="text-xs text-emerald-400">🟢 ปกติ</p>
          <p id="kpiLow" class="text-2xl font-bold text-emerald-400 mt-1">—</p>
          <p class="text-xs text-emerald-700 mt-1 group-hover:text-emerald-400 transition-colors">ดูรายชื่อ →</p>
        </div>
        <!-- Avg Score Gauge -->
        <div class="card rounded-xl p-4 shadow-lg shadow-black/20 flex flex-col items-center justify-center">
          <p class="text-xs text-slate-400 mb-1">Avg Score</p>
          <div class="relative" style="width:72px;height:72px">
            <canvas id="kpiScoreGauge" width="72" height="72"></canvas>
            <div class="absolute inset-0 flex items-center justify-center" style="padding-top:8px">
              <span id="kpiScoreText" class="text-lg font-bold text-white">—</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Search + Filter + Export -->
      <div class="flex flex-wrap gap-3 mb-4">
        <input id="searchInput" type="text" placeholder="ค้นหาชื่อนักเรียน..."
          class="glow-input flex-1 min-w-0 rounded-lg px-4 py-2 text-sm">
        <select id="riskFilter" class="glow-input rounded-lg px-4 py-2 text-sm">
          <option value="">ทุกระดับ</option>
          <option value="HIGH">🔴 เสี่ยงสูง</option>
          <option value="MEDIUM">🟡 เสี่ยงปานกลาง</option>
          <option value="LOW">🟢 ปกติ</option>
        </select>
        <button onclick="TEACHER.exportStudents('excel')"
          class="flex items-center gap-1.5 text-sm bg-emerald-600/80 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg transition-colors shrink-0">
          📊 Excel
        </button>
        <button onclick="TEACHER.exportStudents('pdf')"
          class="flex items-center gap-1.5 text-sm bg-red-600/80 hover:bg-red-600 text-white px-3 py-2 rounded-lg transition-colors shrink-0">
          📄 PDF
        </button>
      </div>

      <div id="studentList" class="space-y-3">
        <p class="text-center text-slate-500 py-8">กำลังโหลด...</p>
      </div>
    </div>

  </div>

  <!-- Intervention Modal -->
  <div id="interventionModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 px-4">
    <div class="rounded-2xl p-6 w-full max-w-md shadow-2xl shadow-black/50 border border-slate-700/50"
      style="background:#0f172a">
      <h3 class="font-bold text-white mb-4">📝 บันทึกการติดตาม</h3>
      <input type="hidden" id="modalStudentId">

      <!-- Recommendation hints -->
      <div id="recHintBox" class="hidden space-y-1.5 mb-4 p-3 rounded-xl border border-blue-700/40 bg-blue-950/40">
        <p class="text-xs font-semibold text-blue-400 mb-1.5">💡 ระบบแนะนำ (กรอกให้อัตโนมัติ)</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-sm font-medium text-slate-300">วิธีการติดตาม</label>
          <select id="interventionMethod"
            class="glow-input w-full rounded-lg px-3 py-2 mt-1 text-sm">
            <option value="call">📞 โทรศัพท์</option>
            <option value="email">📧 อีเมล</option>
            <option value="visit">🏠 เยี่ยมบ้าน</option>
            <option value="meeting">💬 พูดคุยที่โรงเรียน</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
        <div>
          <label class="text-sm font-medium text-slate-300">บันทึกเพิ่มเติม</label>
          <textarea id="interventionNote" rows="3"
            class="glow-input w-full rounded-lg px-3 py-2 mt-1 text-sm resize-none"
            placeholder="รายละเอียดการติดตาม..."></textarea>
        </div>
        <div>
          <label class="text-sm font-medium text-slate-300">ผลลัพธ์</label>
          <select id="interventionOutcome"
            class="glow-input w-full rounded-lg px-3 py-2 mt-1 text-sm">
            <option value="in_progress">⏳ อยู่ระหว่างดำเนินการ</option>
            <option value="resolved">✅ แก้ไขได้แล้ว</option>
            <option value="no_response">❌ ไม่มีการตอบสนอง</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button onclick="TEACHER.closeModal()"
          class="flex-1 border border-slate-600 rounded-lg py-2.5 text-sm text-slate-400 hover:bg-slate-800 transition-colors">
          ยกเลิก
        </button>
        <button onclick="TEACHER.saveIntervention()"
          class="flex-1 gradient-bg text-white rounded-lg py-2.5 text-sm font-medium hover:opacity-90 transition-opacity">
          บันทึก ✅
        </button>
      </div>
    </div>
  </div>

  <!-- Risk Students Modal -->
  <div id="teacherRiskModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 px-4">
    <div class="rounded-2xl shadow-2xl shadow-black/50 w-full max-w-2xl flex flex-col border border-slate-700/50"
      style="background:#0f172a;max-height:80vh">
      <div class="px-6 py-4 border-b border-slate-700/50 flex items-center justify-between shrink-0">
        <h3 id="teacherRiskTitle" class="font-bold text-white"></h3>
        <button onclick="TEACHER.closeRiskModal()"
          class="text-slate-500 hover:text-slate-300 text-xl leading-none transition-colors">✕</button>
      </div>
      <div class="px-4 py-3 border-b border-slate-700/50 shrink-0">
        <input id="teacherRiskSearch" type="text" placeholder="🔍 ค้นหาชื่อ..."
          class="glow-input w-full rounded-lg px-3 py-2 text-sm">
      </div>
      <div id="teacherRiskList" class="overflow-y-auto flex-1 p-4"></div>
    </div>
  </div>

  <script>
    const _v = Date.now();
    ['config','utils','auth','api.v2','charts','teacher'].reduce((p, name) => {
      return p.then(() => new Promise((res, rej) => {
        const s  = document.createElement('script');
        s.src    = `assets/js/${name}.js?v=${_v}`;
        s.onload = res;
        s.onerror = rej;
        document.head.appendChild(s);
      }));
    }, Promise.resolve()).then(() => TEACHER.init());
  </script>
</body>
</html>
